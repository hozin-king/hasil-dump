# Hook targets — Warung Life Simulator 1.2 (versionCode 49)
# package: com.neopawstudio.warunglife
# engine: Godot 4.7.2.stable.official (BUKAN Unity — TIDAK ADA IL2CPP/Mono)
# libgodot_android.so: 71.114.944 B, ELF64 ARM aarch64, STRIPPED,
#   BuildID sha1 270121fef88100c19643517c328b5868e01d345c
#
# CARA BACA FILE INI (PENTING — beda dari hook_targets IL2CPP):
# Game ini TIDAK punya method native bernama seperti IL2CPP. Logika game hidup di
# GDScript bytecode (.gdc) yang di-load engine saat runtime. Karena itu target
# dibagi 3 lapis:
#   A. FILE TARGETS — permukaan mod UTAMA & terbukti: save JSON + config.
#      Root bisa baca/tulis langsung; TIDAK perlu inject .so sama sekali.
#   B. SCRIPT TARGETS — fungsi GDScript (nama file + nomor baris dari dump-full/).
#      Dipakai untuk (1) memahami logika sebelum edit file, (2) pendekatan
#      patch-script masa depan (ganti .gdc di asset pack — BELUM dicoba,
#      butuh verifikasi apakah engine menolak .gdc yang dimodifikasi).
#   C. ENGINE ANCHORS — kandidat hook native di libgodot_android.so.
#      .so STRIPPED (tanpa simbol) -> TIDAK ADA RVA/pola byte yang ter-resolve
#      di tahap ini. Yang dicatat hanya STRING ANCHOR yang terbukti ada di .so,
#      sebagai titik awal pencarian pola (butuh Ghidra/IDA — TIDAK tersedia di VM).
#      JANGAN klaim target lapis C sudah siap dipakai sebelum polanya ditemukan
#      dan diuji unik 1x.
#
# version_gate: HANYA 1.2 / versionCode 49. Cek via cek_versi.gd KODE_BUILD_ANDROID=49
#   dan remote versi.json (min_kode). Build lain = TOLAK (fail-closed).
# fail_closed: true — setiap target yang tidak ketemu = fitur NONAKTIF, bukan crash.
# status_json: injector WAJIB menulis status per-target (ok/nama/pola/beda/gagal)
#   mengikuti pola HSW/EC2, supaya diagnosis POCO bisa dibaca tanpa logcat.

meta:
  game: Warung Life Simulator
  package: com.neopawstudio.warunglife
  version: "1.2"
  version_code: 49
  engine: Godot 4.7.2.stable.official
  engine_lib: libgodot_android.so
  engine_lib_sha1_buildid: 270121fef88100c19643517c328b5868e01d345c
  engine_lib_size: 71114944
  dump_tool: GDRE Tools v2.8.0-beta.2 --bytecode=4.5.0 (bytecode v101)
  dump_dir: dump-full/
  version_gate: "1.2/code 49 only"
  fail_closed: true

# ---------------------------------------------------------------------------
# LAPIS A — FILE TARGETS (mod surface utama, TERBUKTI dari dump)
# user:// di Android = /data/data/com.neopawstudio.warunglife/files/
# Save = JSON polos, TANPA enkripsi, TANPA checksum/hash. Load hanya
# JSON.parse_string + cek dict tidak kosong (game_state.gd _baca_slot, ~3503).
# Tulis atomik via .tmp + .bak (game_state.gd _tulis_slot_aman, ~3461):
#   tulis <file>.tmp -> cek ukuran -> rename lama ke .bak -> rename .tmp ke final.
# Injector yang mengedit save WAJIB meniru pola ini (atau edit saat game mati).
# ---------------------------------------------------------------------------
file_targets:
  - id: save_slot
    path_android: /data/data/com.neopawstudio.warunglife/files/simpanan_N.json
    path_godot: user://simpanan_N.json
    slots: 6
    slot_range: 1..6
    format: JSON polos (JSON.stringify dengan tab), tanpa enkripsi, tanpa hash
    write_pattern: atomic tmp + .bak rotation
    source: dump-full/scripts/game_state.gd (simpan ~3343, _tulis_slot_aman ~3461, _baca_slot ~3503, file_slot ~3259)
    keys:
      uang: {type: int, default: 630000, desc: "Uang tunai Rp (satu-satunya mata uang gameplay)"}
      energi: {type: float, default: 100.0, range: "0..100", desc: "Energi Pak Misran"}
      hari: {type: int, default: 1, desc: "Hari ke-N dalam game"}
      menit: {type: float, desc: "Menit dalam hari (420 = 07:00)"}
      tingkat: {type: int, default: 0, desc: "Level warung 0-based (tampil = tingkat+1); maks 10 (L11 Coming Soon)"}
      progres: {type: dict, keys: [pelanggan, barang, omzet, khusus], desc: "Progres tugas level berjalan"}
      stok: {type: dict, desc: "Stok per barang id, maks 100 per barang (MAKS_STOK_BARANG)"}
      saldo_layanan: {type: int, default: 50000, desc: "Saldo layanan (top-up/data/token)"}
      saldo_digital: {type: int, default: 0, desc: "Saldo digital dari bayar QRIS"}
      reputasi: {type: float, default: 0.0, desc: "Reputasi (bintang dari reputasi)"}
      upgrade_dimiliki: {type: array, desc: "ID upgrade yang dimiliki (12 upgrade, lihat data/upgrade.json)"}
      barang_terbuka: {type: array, desc: "ID barang yang terbuka (37 barang)"}
      harga_jual_khusus: {type: dict, desc: "Harga jual custom per barang"}
      tunggakan_sewa: {type: int, desc: "Tunggakan sewa kios"}
      kios_milik: {type: bool, desc: "True bila kios sudah dibeli (bebas sewa)"}
      motor_cicil: {type: dict, desc: "Status cicilan motor (DP 2jt, tenor 10)"}
      motor_disita: {type: bool, desc: "True bila motor disita matel"}
      motor_baru: {type: bool, desc: "True bila motor baru (wishlist 12jt) dibeli"}
      rumah_renovasi: {type: bool, desc: "True bila rumah baru (wishlist 18jt) dibeli"}
      hape_mewah: {type: bool, desc: "True bila HP mewah (wishlist 6jt) dibeli"}
      hutang: {type: array, desc: "Daftar utang warga (buku hutang)"}
      ngojol: {type: dict, desc: "Status ojek online hari itu"}
      istirahat_hari: {type: dict, desc: "Jejak istirahat/ngopi/makan per hari (batas 1x/hari)"}
      iklan_upgrade: {type: dict, desc: "Jejak iklan yang sudah ditonton"}
      bab: {type: int, desc: "Bab cerita berjalan"}
      misi_status: {type: string, desc: "Status misi cerita"}
      barang_terbuka: {type: array, desc: "Barang yang terbuka"}
      cerita_tamat: {type: bool, desc: "True bila cerita tamat"}
      zakat_dibayar: {type: bool, desc: "Zakat sudah dibayar"}
      transaksi: {type: array, max: 80, desc: "Riwayat transaksi (maks 80)"}
      ulasan: {type: array, max: 60, desc: "Riwayat ulasan (maks 60)"}
      chat: {type: dict, desc: "Chat WhatsApp dalam game"}
      keakraban: {type: dict, desc: "Level keakraban per warga"}
      hasil_alam: {type: dict, desc: "Hasil alam (mancing/petik)"}
      kebun: {type: dict, desc: "Status kebun"}
      promo_dipakai: {type: dict, desc: "Kode promo yang sudah dipakai"}
    notes:
      - "Edit uang/energi/stok/tingkat di file ini = efek langsung saat load berikutnya."
      - "TIDAK ADA validasi server atas isi save saat load lokal (load murni client-side)."
      - "Cloud backup (cadangan_simpan RPC) mengirim paket ini apa adanya (base64+gzip, tanpa enkripsi) — server menyimpan, validasi isi TIDAK TERBUKTI."

  - id: pengaturan
    path_android: /data/data/com.neopawstudio.warunglife/files/pengaturan.cfg
    path_godot: user://pengaturan.cfg
    format: ConfigFile Godot (INI-like, section/key)
    source: dump-full/scripts/game_state.gd (simpan_pengaturan ~4139, muat_pengaturan ~4194)
    keys:
      toko.tanpa_iklan: {type: bool, default: false, desc: "FLAG NO-ADS (IAP Rp29.000) — client-side; entitlement server juga dicatat per id_papan"}
      toko.pendukung: {type: bool, default: false, desc: "True bila pernah donasi (produk dukung_*)"}
      toko.kode_pendukung: {type: string, desc: "Kode pendukung milik pemain"}
      toko.hp_pengembang: {type: bool, default: false, desc: "True = mode pengembang (Unity Ads test mode). Disetel HANYA via kode promo yang hash SHA-256-nya cocok (KODE_PENGEMBANG_HASH) — kode aslinya TIDAK ada di client"}
      toko.tester: {type: bool, desc: "True bila ikut masa uji (progres dipertahankan saat rilis + baju tester)"}
      toko.slot_terakhir: {type: int, desc: "Slot save terakhir dipakai"}
    notes:
      - "tanpa_iklan di sini HANYA flag lokal. cek_hak_bebas_iklan() (game_state ~9274) hanya bisa MENGAKTIFKAN (cek server bila flag masih false), TIDAK PERNAH mencabut flag yang sudah true."
      - "Mengubah flag ini = no-ads lokal aktif. Entitlement server (id_papan) tetap tidak terdaftar — efeknya lokal saja (lihat AUDIT)."

  - id: analitik_cfg
    path_android: /data/data/com.neopawstudio.warunglife/files/analitik.cfg
    path_godot: user://analitik.cfg
    format: ConfigFile Godot
    source: dump-full/scripts/analitik.gd (~51)
    keys:
      analitik.id: {type: string, desc: "ID perangkat acak 16-byte hex (dibuat lokal bila <16 karakter)"}
      analitik.aktif: {type: bool, default: true, desc: "False = analitik mati (atur_aktif)"}
      analitik.hari_ping: {type: string, desc: "Hari terakhir ping sesi"}
    notes:
      - "ID ini dipakai sebagai p_id di semua RPC analitik + kode promo (bukan id_papan)."

  - id: analitik_antre
    path_android: /data/data/com.neopawstudio.warunglife/files/analitik_antre.json
    path_godot: user://analitik_antre.json
    format: JSON array, maks 400 event
    source: dump-full/scripts/analitik.gd (~273)
    desc: "Antrean event analitik yang belum terkirim (kirim tiap 180 dtk, maks 60/kirim)"

  - id: jejak_grafis
    path_android: /data/data/com.neopawstudio.warunglife/files/jejak_grafis.txt
    path_godot: user://jejak_grafis.txt
    source: dump-full/scripts/game_state.gd (~311)
    desc: "Log jejak grafis (dikirim sebagai laporan crash grafis via papan lapor_crash_grafis)"

# ---------------------------------------------------------------------------
# LAPIS B — SCRIPT TARGETS (GDScript, dari dump-full/)
# Dipakai sebagai peta logika. TIDAK ADA alamat native — fungsi-fungsi ini
