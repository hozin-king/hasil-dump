# ---------------------------------------------------------------------------
# LAPIS C — ENGINE ANCHORS (libgodot_android.so, STRIPPED)
# Status: BELUM TER-RESOLVE. String anchor terbukti ada di .so (jumlah hit
# dari `strings`), tapi ALAMAT FUNGSI + POLA BYTE belum dicari (butuh
# disassembly Ghidra/IDA — tidak tersedia di VM ini).
# JANGAN jadikan lapis C sebagai janji fitur sebelum polanya ditemukan,
# diverifikasi unik 1x di segmen RX, dan diuji di POCO.
# ---------------------------------------------------------------------------
engine_anchors:
  lib: libgodot_android.so
  stripped: true
  note: "Godot 4.7.2 tidak mengekspor simbol engine (hanya JNI GodotLib + FreeType). Hook engine = pattern-scan dari anchor string di bawah, lalu xref ke fungsi."
  anchors:
    - {string: "FileAccess", hits: 35, use: "cari FileAccess::open / get_file_as_string — intersep baca/tulis save"}
    - {string: "get_file_as_string", hits: 1, use: "kandidat kuat: fungsi pembaca file utuh (dipakai _baca_slot)"}
    - {string: "store_string", hits: 1, use: "kandidat kuat: fungsi penulis string (dipakai _tulis_slot_aman)"}
    - {string: "parse_string", hits: 1, use: "kandidat: JSON::parse_string — intersep hasil parse save (rewrite in-memory)"}
    - {string: "Failed to open file", hits: 1, use: "anchor error FileAccess::open"}
    - {string: "user://", hits: 5, use: "anchor path user:// (save/config)"}
